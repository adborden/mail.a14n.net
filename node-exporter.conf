# Configuration for the secure proxy
server {
    # Replace with your domain/subdomain
    listen 443 ssl; 
    server_name mail-a.a14n.net mail.a14n.net;

    # --- SSL/TLS Configuration (Replace with your actual paths) ---
    ssl_certificate /etc/letsencrypt/live/mail-a.a14n.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-a.a14n.net/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ---------------------------------------------------------------

    location / {
        # Basic Authentication Configuration
        auth_basic "Authenticaiton Required";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Proxy Node Exporter (default port 9100)
        proxy_pass http://127.0.0.1:9100;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
